lobby_text: Mantener visibles las descripciones de mapas en la sala
lobby_description: Selecciona un mapa en la sala para ver su descripción.
unique_preview_text: Quitar la vista previa al colocar un edificio único
unique_preview_description: Quita la vista previa tras colocar el mercado, el cuartel, el campamento de mercenarios o un gremio.
camera_preview_text: Mantener visible la vista previa al desplazar la cámara
camera_preview_description: La vista previa del edificio permanece visible al mover la cámara.
dead_tree_text: Mostrar por separado los árboles muertos en pie
