tags.interface: Интерфейс
cliff_texture_text: Сохранять стыковку текстур скал при повороте карты
cliff_texture_description: Склоны скал остаются цельными при повороте карты.
ghost_objects_text: Удалять лишние флаги, стрелы и прочую графику на клетках
ghost_objects_description: Убирает объекты, появившиеся не на своей клетке.
ghost_objects_interval_text: Интервал очистки клеток
ghost_objects_interval_description: Меньшие значения быстрее убирают лишние объекты.
