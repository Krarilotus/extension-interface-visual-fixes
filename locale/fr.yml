interface_visual_fixes: Corrections de l’interface et de l’affichage
lobby_text: Descriptions des cartes du salon
lobby_description: Garde visible la description de la carte sélectionnée dans le salon.
unique_preview_text: Fermer l’aperçu des bâtiments uniques après construction
unique_preview_description: Désélectionne le marché, la caserne, le camp de mercenaires et les guildes après une construction réussie.

camera_preview_text: Afficher l’aperçu des bâtiments lors du défilement
camera_preview_description: Garde visible l’aperçu du bâtiment sélectionné pendant le déplacement de la caméra.

dead_tree_text: Distinguer les stades des arbres morts
dead_tree_description: Affiche les arbres morts encore debout avant qu’ils ne deviennent des troncs abattus.

tower_door_text: Aligner les portes des tours sur les murs reliés
tower_door_description: Aligne les portes sur le raccordement admissible le plus haut ; le plus proche du centre du côté départage les égalités. Les portes extérieures rentrent d’une demi-case. Prolonge la maçonnerie sous les tours au bord des falaises, permettant des portes plus basses vers les murs et stair6. Les escaliers surélevés ne comptent pas.
lobby_load_text: Afficher Charger dans le salon d’escarmouche
lobby_load_description: Affiche le bouton Charger existant dans le salon d’escarmouche solo et permet de charger
  une partie sans adversaire IA. Redémarrez le jeu pour appliquer les modifications.

tags.bugfixes: Corrections
tags.interface: Interface

cliff_texture_text: Raccorder les textures des falaises
cliff_texture_description: Préserve la continuité des textures sur les deux faces visibles après rotation de la caméra. Utilise le pack de textures actuel.

ghost_objects_text: Réparer les listes d'objets
ghost_objects_description: |-
  Le jeu maintient une liste des petits objets présents sur chaque case (drapeaux, projectiles, poussière, fumée, oiseaux) et affiche chaque liste sur sa case. Parfois un objet est supprimé alors qu'il figure encore dans la liste d'une case : l'objet suivant qui réutilise son emplacement (drapeau, pierre, flèche...) s'affiche alors aussi sur cette ancienne case, souvent en scintillant. Cette option reconstruit la liste de chaque case d'après la position réelle de chaque objet. Désactivez les options de visée et d'écoulement d'huile d'Improved Siege Engines avant d'utiliser ce correctif.
ghost_objects_interval_text: Réparer à chaque N-ième étape du cycle de ticks
ghost_objects_interval_description: "N, de 1 à 200 : les listes sont reconstruites à chaque N-ième étape du cycle de 200 ticks du jeu (étapes 0, N, 2N, etc. ; si N ne divise pas 200, le dernier intervalle avant le redémarrage du cycle est plus court). Le cycle est enregistré avec la partie, de sorte que chaque joueur et chaque sauvegarde chargée suivent le même rythme. La reconstruction est rapide ; des valeurs plus basses effacent les objets fantômes plus tôt."
