tower_door_text: Alinear puertas de torres y extender la mampostería hasta los bordes de acantilados
tower_door_description: Las puertas de las torres quedan alineadas con las murallas y escaleras conectadas.
lobby_load_text: Mostrar Cargar en la sala de escaramuza para un jugador
lobby_load_description: Haz clic en Cargar en la sala de escaramuza para abrir una partida guardada.
