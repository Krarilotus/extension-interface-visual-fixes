interface_visual_fixes: Arayüz ve Görsel Düzeltmeler
lobby_text: Lobide harita açıklamaları
lobby_description: Seçilen haritanın açıklamasını lobide görünür tutar.
unique_preview_text: Yerleştirmeden sonra benzersiz bina önizlemesini kapat
unique_preview_description: Başarılı yerleştirmeden sonra pazar, kışla, paralı asker kampı ve lonca seçimini kaldırır.

camera_preview_text: Kaydırırken bina önizlemelerini göster
camera_preview_description: Kamera hareket ettirilirken seçili binanın önizlemesini görünür tutar.

dead_tree_text: Ölü ağaç aşamalarını ayır
dead_tree_description: Ölü ağaçları devrilmiş kütüklere dönüşmeden önce ayakta duran hâlleriyle gösterir.

tower_door_text: Kule kapılarını bağlı duvarlara hizala
tower_door_description: Kapıları en yüksek uygun bağlantıya hizalar; eşitlik durumunda kenarın merkezine en yakın olan seçilir. Dıştaki kapılar yarım kare içeri kayar. Uçurum kenarındaki kulelerin altına duvar dokusunu uzatarak daha alçak duvar ve stair6 kapılarına izin verir. Yükseltilmiş merdivenler sayılmaz.
lobby_load_text: Çatışma lobisinde Yükle düğmesini göster
lobby_load_description: Tek oyunculu çatışma lobisinde mevcut Yükle düğmesini gösterir ve yapay zekâ rakibi olmadan
  oyun yüklemeye izin verir. Değişiklikleri uygulamak için oyunu yeniden başlatın.

tags.bugfixes: Hata düzeltmeleri
tags.interface: Arayüz

cliff_texture_text: Döndürürken uçurum dokularını birleştir
cliff_texture_description: Kamera döndürüldüğünde uçurum dokularını görünen iki yüzde de birbirine bağlar. Mevcut doku paketini kullanır.

ghost_objects_text: Nesne listelerini onar
ghost_objects_description: Sahipsiz bayrak, taş ve oklar artık yanlış karede sıkça titreyerek görünmez. Bu düzeltmeyi kullanırken Improved Siege Engines içindeki yağ hedefleme ve yağ yayılma ayarlarını kapatın.
ghost_objects_interval_text: Tik döngüsünün her N'inci adımında onar
ghost_objects_interval_description: "1 ile 200 arasında. Daha düşük değerler sahipsiz nesneleri daha çabuk temizler."
