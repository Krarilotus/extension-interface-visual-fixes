interface_visual_fixes: اصلاحات رابط کاربری و گرافیک
lobby_text: نمایش توضیحات نقشه در لابی
lobby_description: توضیحات نقشهٔ انتخاب‌شده را در لابی قابل مشاهده نگه می‌دارد.
unique_preview_text: بستن پیش‌نمایش ساختمان‌های یکتا پس از ساخت
unique_preview_description: پس از ساخت موفق، انتخاب بازار، سربازخانه، اردوگاه مزدوران و انجمن‌ها را لغو می‌کند.

camera_preview_text: نمایش پیش‌نمایش ساختمان هنگام جابه‌جایی دوربین
camera_preview_description: هنگام حرکت دوربین، پیش‌نمایش ساختمان انتخاب‌شده را قابل مشاهده نگه می‌دارد.

dead_tree_text: متمایز کردن مراحل درختان خشک
dead_tree_description: درختان خشک ایستاده را پیش از آنکه به تنه‌های افتاده تبدیل شوند، نمایش می‌دهد.

tower_door_text: هماهنگ‌سازی درهای برج با دیوارهای متصل
tower_door_description: درها را با بلندترین اتصال معتبر هماهنگ می‌کند؛ در صورت تساوی، نزدیک‌ترین اتصال به مرکز همان ضلع برگزیده می‌شود. درهای کناری نیم خانه به داخل می‌روند. سنگ‌چینی را زیر برج‌های لبهٔ پرتگاه ادامه می‌دهد و امکان ایجاد درهای پایین‌تر برای دیوار و stair6 را فراهم می‌کند. پله‌های مرتفع حساب نمی‌شوند.
lobby_load_text: نمایش بارگذاری در لابی نبرد
lobby_load_description: دکمهٔ بارگذاری موجود را در لابی نبرد تک‌نفره نمایش می‌دهد و بارگذاری بازی بدون حریف هوش
  مصنوعی را ممکن می‌کند. برای اعمال تغییرات، بازی را دوباره اجرا کنید.

tags.bugfixes: رفع اشکال
tags.interface: رابط کاربری

cliff_texture_text: حفظ پیوستگی بافت پرتگاه‌ها پس از چرخش
cliff_texture_description: هنگام چرخش دوربین، پیوستگی بافت پرتگاه‌ها را در هر دو وجه قابل مشاهده حفظ می‌کند. از بستهٔ بافت فعلی استفاده می‌کند.

ghost_objects_text: بازسازی فهرست اشیاء خانه‌ها
ghost_objects_description: بازی فهرستی از اشیاء کوچک روی هر خانه (پرچم‌ها، پرتابه‌ها، گردوغبار، دود، پرندگان) نگه می‌دارد و هر فهرست را روی همان خانه رسم می‌کند. گاهی شیئی حذف می‌شود در حالی که هنوز در فهرست یک خانه مانده است؛ در نتیجه شیء بعدی که جای آن را می‌گیرد (پرچم، سنگ، تیر...) روی آن خانهٔ قدیمی نیز رسم می‌شود و اغلب چشمک می‌زند. این گزینه فهرست هر خانه را بر پایهٔ جایگاه واقعی هر شیء بازسازی می‌کند. پیش از استفاده از این رفع اشکال، گزینه‌های هدف‌گیری و پخش روغن را در Improved Siege Engines خاموش کنید.
ghost_objects_interval_text: بازسازی پس از هر چند تیک بازی
ghost_objects_interval_description: تعداد دفعات بازسازی فهرست‌ها بر حسب تیک بازی (1 تا 200). شمارش از چرخهٔ تیک خود بازی پیروی می‌کند، بنابراین هر بازیکن و هر فایل ذخیرهٔ بارگذاری‌شده از یک زمان‌بندی یکسان استفاده می‌کند. بازسازی سریع است؛ مقادیر کمتر اشیاء شبح را زودتر پاک می‌کنند.
