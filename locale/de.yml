interface_visual_fixes: Oberflächen- und Grafikkorrekturen
lobby_text: Kartenbeschreibungen in der Lobby
lobby_description: Hält die Beschreibung der gewählten Karte in der Lobby sichtbar.
unique_preview_text: Bauvorschau einzigartiger Gebäude nach dem Bau beenden
unique_preview_description: Hebt die Auswahl von Markt, Kaserne, Söldnerlager und Gilden nach erfolgreichem Bau auf.
camera_preview_text: Bauvorschau beim Scrollen anzeigen
camera_preview_description: Hält die Vorschau des gewählten Gebäudes während der Kamerabewegung sichtbar.
dead_tree_text: Abgestorbene Baumstadien unterscheiden
dead_tree_description: Zeigt abgestorbene Bäume zunächst stehend und danach als umgestürzte Stämme.

tower_door_text: Turmtüren an verbindenden Mauern ausrichten
tower_door_description: Richtet Türen an der höchsten geeigneten Verbindung aus; bei gleicher Höhe entscheidet die Nähe zur Seitenmitte. Äußere Türen rücken eine halbe Kachel nach innen. Verlängert das Mauerwerk unter Türmen am Klippenrand und ermöglicht tiefere Türen an Wällen und Stair6. Erhöhte Treppen zählen nicht.
lobby_load_text: Laden in der Gefechtslobby anzeigen
lobby_load_description: Zeigt die vorhandene Laden-Schaltfläche in der Einzelspieler-Gefechtslobby an und ermöglicht
  das Laden ohne KI-Gegner. Das Spiel neu starten, um Änderungen anzuwenden.

tags.bugfixes: Fehlerkorrekturen
tags.interface: Oberfläche

cliff_texture_text: Klippen-Texturen beim Drehen verbinden
cliff_texture_description: Verbindet Klippen-Texturen auf beiden sichtbaren Seiten auch nach dem Drehen der Kamera. Verwendet das aktuelle Texturpaket.

ghost_objects_text: Objektlisten reparieren
ghost_objects_description: Das Spiel führt für jedes Feld eine Liste kleiner Objekte (Flaggen, Geschosse, Staub, Rauch, Vögel) und zeichnet jede Liste auf ihrem Feld. Manchmal wird ein Objekt gelöscht, während es noch in der Liste eines Feldes steht. Das nächste Objekt, das seinen Platz einnimmt (eine Flagge, ein Stein, ein Pfeil ...), wird dann ebenfalls auf diesem alten Feld gezeichnet und flackert oft. Diese Option baut die Liste jedes Feldes anhand der tatsächlichen Position jedes Objekts neu auf. Deaktiviere vor der Nutzung dieses Fixes die Optionen zum Ölzielen und zur Ölausbreitung in Improved Siege Engines.
ghost_objects_interval_text: Alle so viele Spielticks reparieren
ghost_objects_interval_description: Wie oft die Listen neu aufgebaut werden, in Spielticks (1 bis 200). Die Zählung folgt dem spielinternen Tick-Zyklus, sodass jeder Spieler und jeder geladene Spielstand denselben Zeitplan nutzt. Der Neuaufbau ist schnell; kleinere Werte entfernen Geisterobjekte schneller.
