lobby_text: Сохранять видимость описаний карт в лобби
lobby_description: Выберите карту в лобби, чтобы увидеть её описание.
unique_preview_text: Убирать предпросмотр после постройки уникального здания
unique_preview_description: Убирает предпросмотр после размещения рынка, казармы, лагеря наёмников или гильдии.
camera_preview_text: Сохранять предпросмотр постройки при прокрутке камеры
camera_preview_description: Предпросмотр здания остаётся видимым при движении камеры.
dead_tree_text: Отображать стоящие сухие деревья отдельно
dead_tree_description: Стоящие сухие деревья используют отдельную графику, прежде чем стать поваленными стволами.
tower_door_text: Выравнивать двери башен и продлевать кладку до края обрыва
tower_door_description: Двери башен выравниваются по примыкающим стенам и лестницам.
lobby_load_text: Показывать «Загрузить» в лобби одиночной схватки
lobby_load_description: Нажмите «Загрузить» в лобби схватки, чтобы открыть сохранение.
