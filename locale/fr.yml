interface_visual_fixes: Corrections de l’interface et de l’affichage
lobby_text: Descriptions des cartes du salon
lobby_description: Garde visible la description de la carte sélectionnée dans le salon.
unique_preview_text: Fermer l’aperçu des bâtiments uniques après construction
unique_preview_description: Désélectionne le marché, la caserne, le camp de mercenaires et les guildes après une construction réussie.

camera_preview_text: Show building previews while scrolling
camera_preview_description: Keeps the selected building preview visible while moving the camera.

dead_tree_text: Distinguish dead tree stages
dead_tree_description: Shows standing dead trees before they become fallen logs.

tower_door_text: Align tower doors with connecting walls
tower_door_description: Aligns each tower door with the highest eligible connection; the nearest to the side centre breaks ties. Outer doors move half a tile inward. Stair6 allows a ground-level door; raised stairs and connections below the tower base do not count.
lobby_load_text: Afficher Charger dans le salon d’escarmouche
lobby_load_description: Affiche le bouton Charger existant dans le salon d’escarmouche solo et permet de charger
  une partie sans adversaire IA. Redémarrez le jeu pour appliquer les modifications.
