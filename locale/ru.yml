interface_visual_fixes: Исправления интерфейса и графики
lobby_text: Описания карт в лобби
lobby_description: Сохраняет видимость описания выбранной карты в лобби.
unique_preview_text: Убирать предпросмотр уникальных зданий после постройки
unique_preview_description: Снимает выбор рынка, казарм, лагеря наёмников и гильдий после успешного строительства.

camera_preview_text: Показывать предпросмотр зданий при прокрутке
camera_preview_description: Сохраняет предпросмотр выбранного здания видимым при перемещении камеры.

dead_tree_text: Различать стадии мёртвых деревьев
dead_tree_description: Показывает стоящие мёртвые деревья, прежде чем они станут поваленными стволами.

tower_door_text: Выравнивать двери башен по примыкающим стенам
tower_door_description: Выравнивает двери по самому высокому подходящему примыканию; при равной высоте выбирается ближайшее к центру стороны. Крайние двери сдвигаются на полклетки внутрь. Продолжает каменную кладку под башнями у края обрыва, позволяя делать более низкие двери к стенам и stair6. Приподнятые лестницы не учитываются.
lobby_load_text: Показывать загрузку в лобби схватки
lobby_load_description: Показывает существующую кнопку загрузки в лобби одиночной схватки и позволяет загружать
  игру без противника под управлением ИИ. Для применения изменений перезапустите игру.

tags.bugfixes: Исправления
tags.interface: Интерфейс

cliff_texture_text: Продолжать текстуры скал после поворота
cliff_texture_description: Сохраняет стыковку текстур скал на обеих видимых гранях при повороте камеры. Использует текущий набор текстур.

ghost_objects_text: Исправлять списки объектов
ghost_objects_description: Игра хранит список мелких объектов на каждой клетке (флаги, снаряды, пыль, дым, птицы) и отрисовывает каждый список на своей клетке. Иногда объект удаляется, оставаясь в списке клетки, и следующий объект на его месте (флаг, камень, стрела...) тоже начинает отображаться на той старой клетке, часто мерцая. Эта опция заново собирает список каждой клетки по реальным позициям объектов. Перед использованием отключите опции прицеливания и растекания масла в Improved Siege Engines.
ghost_objects_interval_text: Исправлять на каждом N-м шаге цикла тиков
ghost_objects_interval_description: "N, от 1 до 200: списки пересобираются на каждом N-м шаге собственного 200-тикового цикла игры (шаги 0, N, 2N и т. д.; если 200 не делится на N без остатка, последний интервал перед перезапуском цикла короче). Цикл сохраняется вместе с игрой, поэтому у каждого игрока и в каждом загруженном сохранении используется одно и то же расписание. Пересборка быстрая; меньшие значения быстрее убирают призрачные объекты."
