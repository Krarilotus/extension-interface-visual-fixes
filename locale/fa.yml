lobby_text: نمایش پیوستهٔ توضیح نقشه‌ها در لابی
lobby_description: یک نقشه را در لابی انتخاب کنید تا توضیح آن را ببینید.
unique_preview_text: پاک کردن پیش‌نمایش پس از ساخت ساختمان یکتا
unique_preview_description: پس از قرار دادن بازار، سربازخانه، اردوگاه مزدوران یا یک صنف، پیش‌نمایش را پاک می‌کند.
camera_preview_text: نمایان نگه داشتن پیش‌نمایش ساخت هنگام جابه‌جایی دوربین
camera_preview_description: پیش‌نمایش ساختمان هنگام حرکت دادن دوربین همچنان نمایان می‌ماند.
dead_tree_text: نمایش جداگانهٔ درختان خشکیدهٔ ایستاده
dead_tree_description: درختان خشکیدهٔ ایستاده پیش از افتادن و تبدیل شدن به تنه، ظاهر جداگانه دارند.
tower_door_text: هم‌ترازی درهای برج و امتداد سنگ‌چینی تا لبهٔ پرتگاه
tower_door_description: درهای برج با دیوارها و پله‌های متصل هم‌تراز می‌شوند.
lobby_load_text: نمایش دکمهٔ بارگذاری در لابی نبرد آزاد تک‌نفره
lobby_load_description: برای باز کردن فایل ذخیره، در لابی نبرد آزاد روی بارگذاری کلیک کنید.
tags.bugfixes: رفع اشکال
tags.interface: رابط کاربری
cliff_texture_text: هم‌تراز نگه داشتن بافت پرتگاه هنگام چرخش نقشه
cliff_texture_description: دیواره‌های پرتگاه هنگام چرخاندن نقشه پیوسته می‌مانند.
ghost_objects_text: حذف پرچم‌ها، تیرها و دیگر گرافیک‌های سرگردان کاشی‌ها
ghost_objects_description: اشیایی را که روی کاشی نادرست ظاهر می‌شوند پاک می‌کند.
ghost_objects_interval_text: بازهٔ ترمیم کاشی‌ها
ghost_objects_interval_description: مقادیر کمتر، اشیای سرگردان را زودتر پاک می‌کنند.
bugfixes: رفع خطاها
qol: سهولت استفاده
cat_display_previews: نمایش نقشه و پیش‌نمایش‌ها
cat_lobby_multiplayer: لابی و چندنفره
cat_saves_lobby: ذخیره‌ها و لابی
