interface_visual_fixes: Felületi és grafikai javítások
lobby_text: Pályaleírások az előszobában
lobby_description: Látható marad a kiválasztott pálya leírása az előszobában.
unique_preview_text: Egyedi épületek előnézetének törlése építés után
unique_preview_description: Sikeres építés után megszünteti a piac, laktanya, zsoldostábor és céhek kijelölését.

camera_preview_text: Show building previews while scrolling
camera_preview_description: Keeps the selected building preview visible while moving the camera.

dead_tree_text: Distinguish dead tree stages
dead_tree_description: Shows standing dead trees before they become fallen logs.

tower_door_text: Align tower doors with connecting walls
tower_door_description: Aligns each tower door with the highest eligible connection; the nearest to the side centre breaks ties. Outer doors move half a tile inward. Stair6 allows a ground-level door; raised stairs and connections below the tower base do not count.
lobby_load_text: Betöltés megjelenítése a csata előszobájában
lobby_load_description: Megjeleníti a meglévő Betöltés gombot az egyjátékos csata előszobájában, és lehetővé teszi
  a betöltést gépi ellenfél nélkül. A módosítások alkalmazásához indítsd újra a játékot.
