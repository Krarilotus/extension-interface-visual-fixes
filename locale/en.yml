interface_visual_fixes: Interface and Visual Fixes
lobby_text: Show lobby map descriptions
lobby_description: Keeps the selected map's description visible in the lobby.
unique_preview_text: Clear unique-building preview after placement
unique_preview_description: Deselects the marketplace, barracks, mercenary post and guilds after successful placement.
camera_preview_text: Show building previews while scrolling
camera_preview_description: Keeps the selected building preview visible while moving the camera.
dead_tree_text: Distinguish dead tree stages
dead_tree_description: Shows standing dead trees before they become fallen logs.

tower_door_text: Align tower doors with connecting walls
tower_door_description: Aligns doors with the highest eligible connection; nearest to the side centre breaks ties. Outer doors move half a tile inward. Extends masonry below cliff-edge towers, allowing lower wall and stair6 doors. Raised stairs do not count.
lobby_load_text: Show Load in skirmish lobby
lobby_load_description: Shows the existing Load button in the single-player skirmish lobby and allows loading without
  an AI opponent. Restart the game to apply changes.

tags.bugfixes: Bug fixes
tags.interface: Interface

cliff_texture_text: Continue cliff textures after rotation
cliff_texture_description: Keeps cliff textures connected along both visible faces when rotating the camera. Uses the current texture pack.

ghost_objects_text: Repair tile object lists
ghost_objects_description: The game keeps a list of the small objects on each tile (flags, projectiles, dust, smoke, birds). Sometimes an object is deleted while it is still in a list, and the next object that takes its place (a flag, a stone, an arrow) is also drawn on the old tile, often flickering. This rebuilds every tile's list from where each object really is. Turn off the Improved Siege Engines oil aim and oil spread options before using this fix.
ghost_objects_interval_text: Repair on every N-th step of the tick cycle
ghost_objects_interval_description: "N, from 1 to 200: the lists are rebuilt on every N-th step of the game's own 200-tick cycle (steps 0, N, 2N and so on; if N does not divide 200, the last gap before the cycle restarts is shorter). The cycle is saved with the game, so every player and every loaded save uses the same schedule. The rebuild is quick; lower numbers clear ghost objects sooner."
