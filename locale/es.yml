interface_visual_fixes: Correcciones de interfaz y gráficos
lobby_text: Descripciones de mapas en la sala
lobby_description: Mantiene visible la descripción del mapa seleccionado en la sala.
unique_preview_text: Cerrar la vista previa de edificios únicos tras construir
unique_preview_description: Deselecciona el mercado, los cuarteles, el campamento de mercenarios y los gremios tras construirlos correctamente.

camera_preview_text: Show building previews while scrolling
camera_preview_description: Keeps the selected building preview visible while moving the camera.

dead_tree_text: Distinguish dead tree stages
dead_tree_description: Shows standing dead trees before they become fallen logs.

tower_door_text: Align tower doors with connecting walls
tower_door_description: Aligns each tower door with the highest connected wall on its side. Among equally high walls, the connection nearest the side centre wins. The door moves along the tower face and to the wall height.
lobby_load_text: Mostrar Cargar en la sala de escaramuza
lobby_load_description: Muestra el botón Cargar existente en la sala de escaramuza de un jugador y permite cargar
  una partida sin un oponente de IA. Reinicia el juego para aplicar los cambios.
