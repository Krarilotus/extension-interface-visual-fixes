interface_visual_fixes: Correcciones de interfaz y gráficos
lobby_text: Descripciones de mapas en la sala
lobby_description: Mantiene visible la descripción del mapa seleccionado en la sala.
unique_preview_text: Cerrar la vista previa de edificios únicos tras construir
unique_preview_description: Deselecciona el mercado, los cuarteles, el campamento de mercenarios y los gremios tras construirlos correctamente.

camera_preview_text: Mostrar vistas previas de edificios al desplazar la cámara
camera_preview_description: Mantiene visible la vista previa del edificio seleccionado al mover la cámara.

dead_tree_text: Distinguir las fases de los árboles muertos
dead_tree_description: Muestra los árboles muertos en pie antes de que pasen a ser troncos caídos.

tower_door_text: Alinear las puertas de las torres con los muros conectados
tower_door_description: Alinea las puertas con la conexión válida más alta; en caso de empate, elige la más cercana al centro del lado. Las puertas exteriores se desplazan media casilla hacia dentro. Prolonga la mampostería bajo las torres al borde de acantilados, permitiendo puertas más bajas para muros y stair6. Las escaleras elevadas no cuentan.
lobby_load_text: Mostrar Cargar en la sala de escaramuza
lobby_load_description: Muestra el botón Cargar existente en la sala de escaramuza de un jugador y permite cargar
  una partida sin un oponente de IA. Reinicia el juego para aplicar los cambios.

tags.bugfixes: Correcciones
tags.interface: Interfaz

cliff_texture_text: Conectar texturas de acantilados al girar
cliff_texture_description: Mantiene la continuidad de las texturas en ambas caras visibles al girar la cámara. Usa el paquete de texturas actual.

ghost_objects_text: Reparar listas de objetos
ghost_objects_description: El juego guarda una lista de los objetos pequeños en cada casilla (banderas, proyectiles, polvo, humo, pájaros) y dibuja cada lista en su casilla. A veces un objeto se elimina mientras sigue en la lista de una casilla, y el siguiente objeto que ocupa su lugar (una bandera, una piedra, una flecha...) también se dibuja en esa vieja casilla, a menudo parpadeando. Esta opción reconstruye la lista de cada casilla según la posición real de cada objeto. Desactiva las opciones de apuntado y expansión de aceite de Improved Siege Engines antes de usar esta corrección.
ghost_objects_interval_text: Reparar en cada paso N del ciclo de ticks
ghost_objects_interval_description: "N, de 1 a 200: las listas se reconstruyen en cada paso múltiplo de N del ciclo propio de 200 ticks del juego (pasos 0, N, 2N, etc.; si N no divide a 200, el último intervalo antes de reiniciar el ciclo es más corto). El ciclo se guarda con la partida, de modo que cada jugador y cada partida guardada cargada usan la misma programación. La reconstrucción es rápida; valores más bajos eliminan antes los objetos fantasma."
